# HuHoBot 扩展：色图（SexPhoto API）
#
# 数据来源：https://sex.nyan.run/api.html （Pixiv 图库检索/随机接口）
# 触发方式：QQ 群里发 `/色图` 或 `/色图 白洲梓`（也支持 `/执行 色图 ...`）

# QQ 群里触发的指令 key。改完重启生效。
command-key: "色图"

# ── 内容分级 ────────────────────────────────────────────────────────────────
# 是否取 R18 作品。默认 false —— API 默认也是全年龄，返回的是普通 Pixiv 插画。
#
# ⚠️ 打开前请自己确认两件事：
#   1. 群里成员的年龄构成（Minecraft 玩家群体里未成年人占比不低）；
#   2. 你所在地区对传播此类内容的法律规定。
# 打开后本扩展不做任何年龄校验，责任在使用者。
r18: false

# ── 取图参数 ────────────────────────────────────────────────────────────────
# 一次发几张，API 限制 1-10。
num: 1

# 附加标签：用户没给参数时使用。留空则完全随机。
# 可用中文或日文标签，例如 ["ブルーアーカイブ"] 或 ["碧蓝档案"]
default-tags: []

# 锁定的标签：无论用户传什么都会附加，用户无法覆盖。
# 适合用来锁定作品分级或主题，例如 ["風景"]。
locked-tags: []

# ── 限流 ────────────────────────────────────────────────────────────────────
# 同一群同一人的冷却秒数。
# ⚠️ 实测对方限流非常严：间隔 2.5 秒的两次请求就会被 429。别往下调太小，
#    触发限流后群里只会看到「请求太频繁」。
cooldown-seconds: 30

# HTTP 超时（毫秒）
timeout-ms: 15000

# ── API ─────────────────────────────────────────────────────────────────────
# 换成自建反代时改这里
api-base: "https://sex.nyan.run"

# ── 提示语 ──────────────────────────────────────────────────────────────────
# 取图成功后附在图前面的文字。可用占位符：
#   {title} 作品标题   {author} 作者   {pid} 作品 ID   {page} Pixiv 页面地址
# 留空则只发图。
reply-format: "{title} - {author}\n{page}"
